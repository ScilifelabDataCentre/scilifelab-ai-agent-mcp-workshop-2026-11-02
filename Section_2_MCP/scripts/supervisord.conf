[unix_http_server]
file=/tmp/litreview-supervisord.sock

[supervisord]
nodaemon=true
logfile=/tmp/litreview-supervisord.log
logfile_maxbytes=10MB
logfile_backups=1
pidfile=/tmp/litreview-supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/litreview-supervisord.sock

[program:mcp]
command=python server.py --host %(ENV_MCP_HOST)s --port %(ENV_MCP_PORT)s
directory=%(here)s/..
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/tmp/litreview-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:jupyter]
command=bash scripts/start_jupyter_when_ready.sh
directory=%(here)s/..
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
