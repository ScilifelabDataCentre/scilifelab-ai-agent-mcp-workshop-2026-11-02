name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server test dependencies
        run: python -m pip install -r requirements-server.txt
      - name: Validate before publishing
        run: |
          python scripts/preflight.py --strict
          python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build uniquely tagged image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_REF="${IMAGE_NAME}:${TAG}"
          docker buildx build --platform linux/amd64 --load -t "${IMAGE_REF}" .
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
      - name: Smoke-test image before publishing
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.image.outputs.ref }}"
          docker run -d --name serve-publish-smoke -p 7860:7860 "${IMAGE_REF}"
          trap 'docker logs serve-publish-smoke || true; docker rm -f serve-publish-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:7860/login >/dev/null; then
              docker exec serve-publish-smoke python scripts/workshop_healthcheck.py
              exit 0
            fi
            sleep 2
          done
          echo "Workshop container did not become healthy"
          exit 1
      - name: Push validated image
        shell: bash
        run: docker push "${{ steps.image.outputs.ref }}"
      - name: Deployment note
        shell: bash
        run: |
          {
            echo "## SciLifeLab Serve image"
            echo
            echo '```text'
            echo "${{ steps.image.outputs.ref }}"
            echo '```'
            echo
            echo "Make the GHCR package Public, use port 7860 in Serve, and get the Jupyter token from the app logs."
          } >> "$GITHUB_STEP_SUMMARY"
