name: Preflight and container smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server test dependencies
        run: python -m pip install -r requirements-server.txt
      - name: Validate repository and server contract
        run: |
          python scripts/preflight.py --strict
          python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        run: docker buildx build --platform linux/amd64 --load -t session2-serve-smoke:test .
      - name: Run authenticated Jupyter and MCP smoke tests
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name serve-smoke -p 7860:7860 session2-serve-smoke:test
          trap 'docker logs serve-smoke || true; docker rm -f serve-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:7860/login >/dev/null; then
              docker exec serve-smoke python scripts/workshop_healthcheck.py
              exit 0
            fi
            sleep 2
          done
          echo "Workshop container did not become healthy"
          exit 1
