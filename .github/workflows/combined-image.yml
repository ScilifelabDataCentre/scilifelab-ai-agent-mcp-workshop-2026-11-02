name: Combined workshop image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: combined-workshop-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP test dependencies
        run: python -m pip install -r Section_2_MCP/requirements-server.txt
      - name: Validate repository and MCP tests
        run: |
          python scripts/preflight.py --strict
          python -m unittest discover -s tests -v
          cd Section_2_MCP
          python -m unittest discover -s tests -v
      - name: Enable ARM64 emulation for build and smoke tests
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Create unique multi-architecture image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "ref=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
      - name: Build amd64 and arm64 images
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.image.outputs.ref }}"
          for ARCH in amd64 arm64; do
            docker buildx build --platform "linux/${ARCH}" --load \
              -t "${IMAGE_REF}-${ARCH}" .
          done
      - name: Smoke-test both architectures
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.image.outputs.ref }}"
          NAME=""
          cleanup() {
            if [[ -n "${NAME}" ]]; then
              docker logs "${NAME}" || true
              docker rm -f "${NAME}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          for ARCH in amd64 arm64; do
            NAME="combined-workshop-smoke-${ARCH}"
            case "$ARCH" in
              amd64) EXPECTED_MACHINE=x86_64 ;;
              arm64) EXPECTED_MACHINE=aarch64 ;;
            esac
            docker run -d --name "${NAME}" --platform "linux/${ARCH}" \
              -p 7860:7860 "${IMAGE_REF}-${ARCH}"
            test "$(docker exec "${NAME}" id -u)" = "1000"
            test "$(docker exec "${NAME}" uname -m)" = "${EXPECTED_MACHINE}"
            docker exec "${NAME}" python -c "from pathlib import Path; root=Path('/home/workshop/app'); assert (root/'Section_1_LangGraph/langgraph_lab.ipynb').is_file(); assert (root/'Section_2_MCP/1-mcp-hands-on/mcp_literature_review_lab.ipynb').is_file()"
            READY=0
            for i in $(seq 1 120); do
              if curl --fail --silent --show-error http://127.0.0.1:7860/login >/dev/null; then
                docker exec "${NAME}" python scripts/workshop_healthcheck.py
                READY=1
                break
              fi
              sleep 2
            done
            if [[ "$READY" -ne 1 ]]; then
              echo "Combined ${ARCH} container did not become healthy"
              exit 1
            fi
            echo "Combined ${ARCH} image passed all smoke tests"
            docker rm -f "${NAME}" >/dev/null
            NAME=""
          done
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures and the multi-architecture manifest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.image.outputs.ref }}"
          docker push "${IMAGE_REF}-amd64"
          docker push "${IMAGE_REF}-arm64"
          docker buildx imagetools create -t "${IMAGE_REF}" \
            "${IMAGE_REF}-amd64" "${IMAGE_REF}-arm64"
          docker buildx imagetools inspect "${IMAGE_REF}" | tee /tmp/combined-manifest.txt
          grep -q 'linux/amd64' /tmp/combined-manifest.txt
          grep -q 'linux/arm64' /tmp/combined-manifest.txt
      - name: Serve deployment note
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "## Combined multi-architecture SciLifeLab Serve image"
            echo
            echo '```text'
            echo "${{ steps.image.outputs.ref }}"
            echo '```'
            echo
            echo "This manifest contains linux/amd64 and linux/arm64. Serve selects amd64 automatically; ARM and Intel/AMD laptops select their native variant. Make the GHCR package Public, use port 7860, and read the Jupyter token from the Serve app logs."
          } >> "$GITHUB_STEP_SUMMARY"
